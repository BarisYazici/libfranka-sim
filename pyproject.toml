[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2",  "numpy==1.26.4"]
build-backend = "setuptools.build_meta"

[project]
name = "franka-sim"
description = "A high-fidelity simulation server that implements the Franka robot network protocol, enabling seamless switching between simulation and hardware."
requires-python = ">=3.9"
dynamic = ["version"]  # Use dynamic versioning from git tags
dependencies = [
    "numpy==1.26.4",
    # Upper bound: mujoco_franka_sim.py's MjSpec light setup (light.directional)
    # breaks on mujoco>=3.3 (the attribute was removed from MjsLight there,
    # verified against 3.3.7). Widen once that call site is ported.
    "mujoco>=3.2,<3.3",
    "trimesh>=4.0",
    "robot_descriptions>=1.12",
]
readme = "README.md"
authors = [
    {name = "Baris Yazici", email = "barisyazici@alumni.sabanciuniv.edu"}
]
license = {text = "Apache-2.0"}
keywords = ["robotics", "simulation", "franka", "robot", "genesis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
"Homepage" = "https://github.com/BarisYazici/libfranka-sim"
"Bug Tracker" = "https://github.com/BarisYazici/libfranka-sim/issues"
"Documentation" = "https://github.com/BarisYazici/libfranka-sim#readme"

[project.scripts]
run-franka-sim-server = "franka_sim.run_server:main"
run-franka-spine-stub = "franka_sim.spine_stub:main"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.5.0",
    "black>=24.1.1",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "flake8-docstrings>=1.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",

]
# --physics genesis for the single-arm and mobile-duo scenes. Kept out of the
# base dependencies since MuJoCo (the default backend) holds real time at the
# FCI's 1 ms step where Genesis needs 2.5 ms and still falls behind on the
# duo scene; pull this extra in only to run the Genesis path.
# NOTE: genesis-world==0.2.1 needs "libigl<2.6" (>=2.6 changes
# igl.signed_distance's return arity); pip install that pin alongside this
# extra if Genesis import fails with an unpacking error.
genesis = [
    "genesis-world==0.2.1",
    "numba==0.60.0",
    "torch>=2.0.0",
]
# Build the documentation site (mkdocs.yml + docs/), deployed to
# https://barisyazici.github.io/libfranka-sim/ by .github/workflows/docs.yml.
# The site build imports nothing from franka_sim, so these are the only tools
# the docs job actually needs. mkdocs is pinned <2: MkDocs 2.0 removes the
# plugin and theming systems Material depends on.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "pymdown-extensions>=10.7,<12",
]

[tool.setuptools]
packages = ["franka_sim", "franka_sim.assets"]

[tool.setuptools.package-data]
franka_sim = ["models/*.urdf"]
"franka_sim.assets" = ["franka_hand/*.obj", "franka_hand/*.stl"]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=franka_sim --cov-report=term-missing"

[tool.setuptools_scm]
# This will get the version from the most recent git tag
# Fallback version when not in a git repository
fallback_version = "0.1.5"
# Use standard version scheme
version_scheme = "guess-next-dev"
# Use clean tag version when building from a tag
local_scheme = "no-local-version"
