name: Python Package Build and Release

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'franka_sim/**'
      - '.github/workflows/python-package.yml'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11']
        exclude:
          - os: macos-latest
            python-version: '3.9'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest pytest-cov
      - name: Run release tests
        run: python -m pytest tests/test_commands_mock.py tests/test_robot_state.py -v

  build:
    name: Build one universal wheel and source distribution
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Derive release version from the tag
        id: version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check the installed wheel's entry points
        run: |
          python -m pip install dist/*.whl
          franka-sim-check --help
          run-franka-sim-server --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  publish:
    name: Create GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/*
          body: |
            # franka-sim ${{ needs.build.outputs.version }}

            Install with `pip install franka-sim==${{ needs.build.outputs.version }}`.

            Docker images are published by the separate Docker workflow:
            `ghcr.io/barisyazici/franka-sim:${{ needs.build.outputs.version }}` and
            `ghcr.io/barisyazici/franka-sim:${{ needs.build.outputs.version }}-viewer`.
            Wait for that workflow to finish before pulling the images.

            [Changes](https://github.com/BarisYazici/libfranka-sim/blob/${{ github.ref_name }}/CHANGELOG.md)
            · [Viewer setup](https://github.com/BarisYazici/libfranka-sim/blob/${{ github.ref_name }}/README.md#docker-desktop-visualization)

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
