name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  # Allow a manual rebuild from the Actions tab.
  workflow_dispatch:

# Read the repo, write the Pages deployment, mint the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a newer push supersede a queued one but
# not cancel a deployment already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install docs dependencies
        # The [docs] extra is the single source of truth for the doc toolchain;
        # installing the project alongside it also keeps the version metadata
        # available should a page ever want it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[docs]'

      - name: Build (strict)
        # --strict turns every MkDocs warning (dead internal links, missing
        # nav targets, unreadable files) into a build failure.
        run: mkdocs build --strict

      - name: Upload Pages artifact
        # Runs on PRs too: the build is validated, but only main deploys.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
