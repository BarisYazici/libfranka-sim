name: Docker image

# Build the server image, prove it end-to-end by running this repo's own
# GitHub Action against it (the same action users put in their CI), then
# publish: main -> :edge, v* tags -> :<version> and :latest.

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'action.yml'
      - 'franka_sim/**'
      - 'pyproject.toml'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]
    tags: ['v*']

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/franka-sim

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe needs the tags

      - name: Compute version and image name
        id: meta
        run: |
          # setuptools_scm needs PEP 440: v1.0.0 -> 1.0.0,
          # v1.0.0-4-g523fc48 -> 1.0.0.post4+g523fc48, bare sha -> 0.0.0+g<sha>
          raw=$(git describe --tags --always)
          case "$raw" in
            v[0-9]*|[0-9]*)
              version=$(echo "$raw" | sed -E 's/^v//; s/-([0-9]+)-g([0-9a-f]+)$/.post\1+g\2/') ;;
            *)
              version="0.0.0+g$raw" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"  # ghcr requires lowercase

      - name: Build image
        run: |
          docker build \
            --build-arg FRANKA_SIM_VERSION='${{ steps.meta.outputs.version }}' \
            -t '${{ steps.meta.outputs.image }}:ci' .

      - name: Start the server with this repo's own action (dogfood)
        uses: ./
        with:
          image: ${{ steps.meta.outputs.image }}
          tag: ci
          args: '--enforce-comm-constraints --enforce-motion-limits'

      - name: Probe the server from the host, as a user's job would
        run: |
          python3 -m pip install --quiet .
          python3 -m franka_sim.health_check --host 127.0.0.1 --port 1337 --timeout 30

      - name: Server logs
        if: always()
        run: docker logs franka-sim || true

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish :edge (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag '${{ steps.meta.outputs.image }}:ci' '${{ steps.meta.outputs.image }}:edge'
          docker push '${{ steps.meta.outputs.image }}:edge'

      - name: Publish :<version> and :latest (tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          image='${{ steps.meta.outputs.image }}'
          version='${{ steps.meta.outputs.version }}'
          docker tag "$image:ci" "$image:$version"
          docker tag "$image:ci" "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"
