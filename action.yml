name: 'franka-sim server'
description: 'Start a franka-sim FCI server in Docker so libfranka and franka_ros2 CI jobs run against a simulated FR3 - no robot needed.'
author: 'Baris Yazici'
branding:
  icon: 'cpu'
  color: 'orange'

inputs:
  image:
    description: 'Container image to run'
    required: false
    default: 'ghcr.io/barisyazici/franka-sim'
  tag:
    description: 'Image tag'
    required: false
    default: 'latest'
  args:
    description: >-
      Extra run-franka-sim-server arguments, e.g.
      "--enforce-comm-constraints --enforce-motion-limits" or "--no-gripper".
      Word-split as shell arguments.
    required: false
    default: ''
  port:
    description: 'FCI command port the server is expected on (only change this if you also pass --port in args)'
    required: false
    default: '1337'
  container-name:
    description: 'Name for the started container (docker logs <name> to inspect it)'
    required: false
    default: 'franka-sim'
  cpu-shares:
    description: >-
      Docker --cpu-shares weight for the simulator container (default 4096,
      i.e. 4x a default container). Only matters under CPU contention, which
      is exactly when the 1 kHz robot must not be the process that starves:
      on a 2-core hosted runner a hung ros2_control_node otherwise stalls the
      state stream long enough for the next client to time out at connect.
    required: false
    default: '4096'
  wait-timeout:
    description: 'Seconds to wait for the server to pass the readiness handshake'
    required: false
    default: '90'

outputs:
  host:
    description: 'Address the FCI is served on (host networking: 127.0.0.1)'
    value: '127.0.0.1'
  port:
    description: 'FCI command port'
    value: ${{ inputs.port }}
  container-name:
    description: 'Name of the running container'
    value: ${{ inputs.container-name }}

runs:
  using: 'composite'
  steps:
    - name: Start franka-sim container
      shell: bash
      # Inputs come in through env, not ${{ }} interpolation into the script:
      # a repo-controlled value must never be able to inject shell into a
      # user's runner. SERVER_ARGS is word-split on purpose (it is an argv
      # tail); unquoted expansion splits words but executes nothing.
      env:
        FS_IMAGE: ${{ inputs.image }}
        FS_TAG: ${{ inputs.tag }}
        FS_NAME: ${{ inputs.container-name }}
        SERVER_ARGS: ${{ inputs.args }}
        FS_CPU_SHARES: ${{ inputs.cpu-shares }}
      run: |
        # Host networking on purpose: the FCI is a 1 kHz UDP loop; publishing
        # ports would put Docker's NAT in the middle of it.
        [[ "$FS_CPU_SHARES" =~ ^[0-9]+$ ]] || { echo "::error::cpu-shares must be an integer, got '$FS_CPU_SHARES'"; exit 1; }
        docker rm -f "$FS_NAME" 2>/dev/null || true
        docker run -d --network host --cpu-shares "$FS_CPU_SHARES" --name "$FS_NAME" "$FS_IMAGE:$FS_TAG" $SERVER_ARGS

    - name: Wait until the server serves the FCI
      shell: bash
      env:
        FS_NAME: ${{ inputs.container-name }}
        FS_PORT: ${{ inputs.port }}
        FS_WAIT: ${{ inputs.wait-timeout }}
      run: |
        # Validate before use: these land in arithmetic context, where bash
        # would otherwise evaluate hostile content.
        [[ "$FS_PORT" =~ ^[0-9]+$ ]] || { echo "::error::port must be an integer, got '$FS_PORT'"; exit 1; }
        [[ "$FS_WAIT" =~ ^[0-9]+$ ]] || { echo "::error::wait-timeout must be an integer, got '$FS_WAIT'"; exit 1; }
        # franka-sim-check performs a real Connect handshake and waits for a
        # RobotState datagram; it retries internally until the timeout. The
        # outer loop only covers the moments before the container's PID 1 can
        # be exec'd into. One-shot by design: the probe briefly occupies the
        # single FCI client slot, so it must not run periodically.
        deadline=$(( $(date +%s) + FS_WAIT ))
        until docker exec "$FS_NAME" franka-sim-check \
              --port "$FS_PORT" \
              --timeout $(( deadline - $(date +%s) > 1 ? deadline - $(date +%s) : 1 )); do
          if [ "$(date +%s)" -ge "$deadline" ] || \
             [ "$(docker inspect -f '{{.State.Running}}' "$FS_NAME" 2>/dev/null)" != "true" ]; then
            echo '::error::franka-sim server did not become ready; container logs follow'
            docker logs "$FS_NAME" || true
            exit 1
          fi
          sleep 2
        done
        echo "franka-sim ready on 127.0.0.1:$FS_PORT"
